<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
</head>

<body>

    <input type="text" placeholder="Click here to focus" onkeydown="demo(event)">
    <input type="text" placeholder="Click here to focus" onkeyup="demo(event)">
    <button onclick="myFunction()">Click me</button>
    <input type="text" placeholder="press A" onkeydown="letterkey(event)">
    <p id="demo_"></p>
    <script>
        // function myFunction() {
        //     alert("Hello! I am an alert box!");
        // }

        function demo(hello) {
            console.log(hello);
            console.log(hello.keyCode);
            console.log(hello.code);
            let minekey = hello.key;
            if (minekey == "Enter") {
                alert("You have pressed Enter key");
            }

        }
        function letterkey(hii) {
            console.log(hii.key);
            let mykey = hii.key;
            if (mykey === "a" || mykey === "A") {
                alert("You pressed the 'A' key!");
                let text = "You pressed the 'A' key!";
                document.getElementById("demo_").innerHTML = text;
            }
            else {
                document.getElementById("demo_").innerHTML = "hello";

            }
        }

    </script>

</body>


</html>
