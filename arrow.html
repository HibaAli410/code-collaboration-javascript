<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Functions</title>
</head>

<body>

    <script>

        function nameabc() {
            // exicutions
            console.log("Abc")
        }
        nameabc();
        nameabc();
        nameabc();
        const greet = () => {
            console.log("hello");
        }

        greet();

    </script>

</body>

</html>
