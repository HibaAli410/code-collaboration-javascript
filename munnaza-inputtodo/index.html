<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="text" id="text" name="text" onkeydown="todo_task(event)" placeholder="Add an item">
    <script src="style.js">

        // container styling

        let container = document.createElement("div")
        container.style.width = "90%"
        container.style.maxWidth = "500px"
        container.style.minHeight = "100px"
        container.style.height = "auto"
        container.style.backgroundColor = "rgb(3 17 24 / 18%)"
        container.style.display = " flex"
        container.style.flexDirection = " column"
        container.style.justifyContent = "center"
        container.style.alignItems = "center"
        container.style.borderRadius = "20px"
        container.style.boxShadow = "20px 19px 25px rgb(1 0 0 / 51%)"

        // list
        let ul = document.createElement("ul")

        // ul styling

        ul.className = "todo-list";
        ul.style.padding = "20px";
        ul.style.width = "80%"
        let storage_ = JSON.parse(localStorage.getItem("todolist")) || []

        storage_.forEach(store => {
            let li = document.createElement("li")
            li.innerHTML = store;
            styleTask(li);
            ul.appendChild(li);
        });


        storage_ = JSON.parse(localStorage.getItem("todolist")) || [];

        storage_.forEach(store => {
            let li = document.createElement("li")
            li.innerHTML = store;
            styleTask(li);
            ul.appendChild(li);
        });
        let task = document.getElementById("text");
        task.addEventListener("onkeydown", todo_task)

        function todo_task(event) {
            if (event.keyCode === 13 && event.target.value.trim() != "") {
                let display = event.target.value
                storage_ = JSON.parse(localStorage.getItem("todolist")) || []
                if (storage_.includes(display)) {
                    alert("Task already exists!")
                } else {
                    storage_.push(display)
                    storage_ = localStorage.setItem("todolist", JSON.stringify(storage_))
                    let li = document.createElement("li")
                    li.innerHTML = display;
                    styleTask(li);
                    ul.appendChild(li)
                }
            }

        container.appendChild(ul)
        document.body.appendChild(container)
    </script>
</body>

</html>
