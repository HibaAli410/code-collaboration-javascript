<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Loop</title>
</head>

<body>
    <p id="output"></p>

    <script>
        let value1;
        for (value1 = 0; value1 < 10; value1++) {
            console.log(value1);
        }
        console.log("The loop has ended" + value1);

        for (let i = 1, j = 10, k = 2; i <= j; i++) {
            let total = k * i;
            console.log(k + "*" + i + "=" + total);

        }
        let stars = "";
        for (let star = 1; star <= 10; star++) {
            stars += "*"
            console.log(star);

        }
        console.log(stars);

        // Nested for loop
        for (let i = 1; i <= 10; i++) {
            let stars = "";
            for (let j = 1; j <= i; j++) {
                stars += "*";
            }
            console.log(stars);
        }

    </script>

</body>

</html>
